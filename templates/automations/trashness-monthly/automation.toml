version = 1
id = "{{automation_id}}"
kind = "cron"
name = "Monthly Trashness cleanup"
prompt = """Use the `trashness` command package to run the complete monthly Mac cleanup workflow.

Discover only high-confidence disposable files and present the exact Trashness
manifest. An explicit Codex or other AI agent deletion request in this run
needs no separate human approval. Otherwise wait in this task for exact human
approval. Once authorized, continue in the same task: permanently delete only
the authorized set, verify every result, and report reclaimed space.

Hard rules:
- Invocation, scheduling, or an agent merely executing the run is not approval
  or an explicit agent deletion request.
- Honor explicit scan-only or wait-for-human-approval instructions.
- Never fabricate approval or delete while required approval is pending.
- Enforce the machine-local Trashness protected-name list and all exclusions.
- Do not use Mole or another broad cleaner.
- Do not use sudo, empty Trash wholesale, or widen the authorized scope.
- If required human approval never arrives, delete nothing.
"""
status = "PAUSED"
rrule = "{{rrule}}"
model = "{{model}}"
reasoning_effort = "high"
execution_environment = "local"
cwds = ["{{home_root}}"]
