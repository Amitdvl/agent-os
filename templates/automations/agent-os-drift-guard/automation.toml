version = 1
id = "{{automation_id}}"
kind = "heartbeat"
name = "Agent OS Drift Guard"
prompt = """Audit the current Agent OS checkout and its configured Codex host for portable-contract and live-surface integrity drift. Stay quiet when every check is clean.

From the Agent OS root, run `npm run validate`, `npm test`, `git diff --check`, `./bin/agent-os status --json`, `./bin/agent-os doctor --json`, and `node --experimental-strip-types skills/skill-cleaner/scripts/skill-cleaner.ts --no-logs --check --json`. Then run this full live audit:
`./bin/twin-audit --live-registry ~/.codex/local-tools/registry.yaml --live-commands ~/.codex/skills --live-goal-prompt ~/.codex/skills/goal-prompt/SKILL.md --live-orchestration ~/.codex/skills/orchestration/SKILL.md --live-instructions ~/.codex/AGENTS.md --live-tool-root ~/.agent-os/local-tools/tools --live-skill-root ~/.codex/skills --live-symlink-root ~/.agents/skills --live-codex-config ~/.codex/config.toml --live-rules ~/.codex/rules/agent-os.rules --live-ctx7-hook ~/.codex/hooks/ctx7_guard.py --live-ctx7-test ~/.codex/hooks/tests/test_ctx7_guard.py --live-no-verify-hook ~/.codex/hooks/onboard_block_no_verify.sh`.

Safe self-heal boundary:
- You may run `agent-os update --apply` only when the repository is clean, the managed-state ledger exists, the preview has no conflicts, and the only changes are already ledger-owned generated outputs. Re-run every audit after it.
- Do not overwrite an unowned skill, tool adapter, hook, AGENTS policy, automation, registry, default.rules, or source-version change. Do not install, authenticate, inspect secrets or sessions, or create memory files.
- Treat a dangling skill link, missing skill entrypoint, enabled duplicate skill name, omitted live skill, missing registered `routing.md`, uncovered live skill, unreadable skill path declared by live instructions, or stale governed hook test as a hard mismatch; never hide it in an ignored-skill list.
- For a non-generated mismatch, report the exact surface and a focused remediation recommendation. If repair changes Agent OS source, stop for a separate explicitly scoped task; source edits require validation, tests, twin audit, focused commit, and push.

Notify only for a completed safe repair, a failed verification, or a mismatch requiring a remediation task.
"""
status = "PAUSED"
rrule = "{{rrule}}"
target_thread_id = "{{target_thread_id}}"
