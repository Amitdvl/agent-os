version = 1
id = "{{automation_id}}"
kind = "heartbeat"
name = "Agent OS Drift Guard"
prompt = """Audit the current Agent OS checkout and its configured Codex host for portable-contract and live-surface integrity drift. Stay quiet when every check is clean.

From the Agent OS root, run `npm run validate`, `npm test`, `git diff --check`, `./bin/agent-os status --json`, `./bin/agent-os doctor --json`, and `node --experimental-strip-types skills/skill-cleaner/scripts/skill-cleaner.ts --no-logs --check --json`. Then run this full live audit:
`./bin/twin-audit --live-registry ~/.codex/local-tools/registry.yaml --live-commands ~/.codex/skills --live-goal-prompt ~/.codex/skills/goal-prompt/SKILL.md --live-orchestration ~/.codex/skills/orchestration/SKILL.md --live-instructions ~/.codex/AGENTS.md --live-tool-root ~/.agent-os/local-tools/tools --live-skill-root ~/.codex/skills --live-symlink-root ~/.agents/skills --live-codex-config ~/.codex/config.toml --live-rules ~/.codex/rules/agent-os.rules --live-ctx7-hook ~/.codex/hooks/ctx7_guard.py --live-ctx7-test ~/.codex/hooks/tests/test_ctx7_guard.py --live-no-verify-hook ~/.codex/hooks/onboard_block_no_verify.sh`.

Repair escalation:
- You may run `agent-os reconcile-instructions --apply` only when `agent-os status --json` reports a managed instruction-block drift, its preview has no conflicts and only exact-match `adopt` instruction records, and the repository is clean. This updates ledger metadata only; it never writes AGENTS guidance. Re-run every audit after it.
- Mandatory completion rule: do not stop at diagnosis or leave a remediation recommendation merely because the repair is higher-risk or less routine. Resolve every discovered drift in this run, including exact-content adoption of pre-existing Agent OS surfaces with `agent-os update --adopt-existing --apply`, then re-run every audit until it passes.
- Escalate methodically: for a repair outside normal self-heal, verify the exact target and cause, make the minimum scoped reversible change, retain a recoverable backup and decisive evidence, then verify immediately. This includes materializing exact canonical Agent OS symlinks, adopting exact content, and repairing managed configuration conflicts. Do not label a repair impossible solely because it is less safe or requires several corrective steps.
- You may run `agent-os update --apply` only when the repository is clean, the managed-state ledger exists, the preview has no conflicts, and the only changes are already ledger-owned generated outputs or exact-content `adopt` records. Re-run every audit after it.
- When repair requires an Agent OS source change, make the smallest scoped change, run validation, tests, diff check, and the full twin audit, commit it, push it to the configured `origin`, deploy only the generated live outputs, and continue verification in the same run.
- Never perform an irreversible, externally visible, credential/authentication, secret/session, or ambiguous user-owned change without a concrete target and current-run user authority. Preserve all standing safety constraints.
- Treat a dangling skill link, missing skill entrypoint, enabled duplicate skill name, omitted live skill, missing registered `routing.md`, uncovered live skill, unreadable skill path declared by live instructions, or stale governed hook test as a hard mismatch; never hide it in an ignored-skill list.
- If an external or non-matching user-owned surface cannot be safely repaired, continue all other repairs and report the exact remaining decision or access requirement.

Notify only for a completed safe repair, a failed verification, or a mismatch requiring a remediation task.
"""
status = "PAUSED"
rrule = "{{rrule}}"
target_thread_id = "{{target_thread_id}}"
